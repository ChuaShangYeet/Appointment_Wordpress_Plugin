# Production-shaped stack. (Local development uses docker-compose.dev.yml.)
#
#   cp .env.example .env     # fill in EVERY secret; see the "production" section of README.md
#   docker compose up -d --build
#
# Four things differ from a quick demo stack, on purpose:
#   * three database roles, not one: `booking_owner` runs the migrations, `booking_app` is what the API and the worker use (rows only: it
#     cannot change the schema or switch Row-Level Security off), `booking_backup` is read-only for deploy/backup.sh. The superuser
#     `postgres` is used once, to create them (deploy/postgres/01_roles.sql), and by hand for restores.
#   * migrations are their own one-shot service (`migrate`); the API and worker wait for it and never run DDL.
#   * the database and Redis are not published on the host.
#   * every password must be set: compose stops if one is missing. Use URL-safe characters (e.g. `openssl rand -hex 24`), they go into URLs.
# The API and the worker refuse to start (app/core/hardening.py) if the database role they were given ignores Row-Level Security or a
# secret is still a placeholder. NOTE: this file has never been run (no Docker on the development machine); the role setup it relies on
# was checked by hand against PostgreSQL 16 (see README: "Verified, and not").
services:
  postgres:
    image: postgis/postgis:16-3.4   # PostgreSQL 16 + PostGIS; btree_gist ships in contrib
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: booking
      BOOKING_OWNER_PASSWORD: ${BOOKING_OWNER_PASSWORD:?set BOOKING_OWNER_PASSWORD}
      BOOKING_APP_PASSWORD: ${BOOKING_APP_PASSWORD:?set BOOKING_APP_PASSWORD}
      BOOKING_BACKUP_PASSWORD: ${BOOKING_BACKUP_PASSWORD:?set BOOKING_BACKUP_PASSWORD}
    expose: ["5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # runs once, when the data directory is created; the .sql is mounted elsewhere so the image does not run it without its variables
      - ./deploy/postgres/01_roles.sh:/docker-entrypoint-initdb.d/01_roles.sh:ro
      - ./deploy/postgres/01_roles.sql:/deploy/01_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [booking]

  redis:
    image: redis:7-alpine
    # a password, so that only the api and the worker can use it (it holds pending sign-ups and the hashes of sign-in codes)
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    restart: unless-stopped
    networks: [booking]

  migrate:
    build: .
    env_file: .env
    environment:
      ENVIRONMENT: production   # (stated here, not left to .env: "development" switches the start-up safety checks off)
      DATABASE_URL: postgresql+asyncpg://booking_app:${BOOKING_APP_PASSWORD}@postgres:5432/booking
      MIGRATION_DATABASE_URL: postgresql+asyncpg://booking_owner:${BOOKING_OWNER_PASSWORD}@postgres:5432/booking
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
    networks: [booking]

  api:
    build: .
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://booking_app:${BOOKING_APP_PASSWORD}@postgres:5432/booking
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]   # put a TLS-terminating reverse proxy in front, and set RATE_LIMIT_TRUSTED_PROXIES to the number of proxies
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz').status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
    restart: unless-stopped
    networks: [booking]

  # Periodic sweep: expires unanswered pending holds, checks new bookings against recent setting changes, sends reminders and webhooks.
  worker:
    build: .
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://booking_app:${BOOKING_APP_PASSWORD}@postgres:5432/booking
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: python -m app.worker
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
    restart: unless-stopped
    networks: [booking]

volumes:
  pgdata:

networks:
  booking:
