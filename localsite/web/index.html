<title>Appointment Demonstration</title>
<meta name="description" content="Clickable prototype of the JustSimple booking product, with mock data, for UX testing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a light strip on top (the site is light only); the customer screens are one phone-width column (the booking widget as a visitor sees it),
   the business admin is a wide board with a booking drawer on the right, the sign-up is a narrow form. */
:root {
  --bg: #f4f7f5;
  --surface: #ffffff;
  --surface-2: #eaf0ec;
  --line: #d3ddd7;
  --fg: #13201a;
  --muted: #56675f;
  --accent: #1b6a50;
  --accent-strong: #135540;
  --accent-fg: #ffffff;
  --accent-soft: #d9eee4;
  --ok: #1f7a46; --ok-soft: #dcf1e3;
  --warn: #9a6200; --warn-soft: #fbedd0;
  --bad: #b3362d; --bad-soft: #fbe2df;
  --info: #2c5b9a; --info-soft: #e0eaf8;
  --harness-bg: #ffffff;
  --harness-fg: #13201a;
  --harness-line: #d3ddd7;
  --shadow: 0 1px 2px rgb(19 32 26 / 6%), 0 6px 18px rgb(19 32 26 / 6%);
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --r: 10px;
  color-scheme: light;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.75rem; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spread { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }

/* ---------------------------------------------------------------- the prototype strip (not part of the product) */
.harness { background: var(--harness-bg); color: var(--harness-fg); padding: 10px 16px; border-bottom: 1px solid var(--harness-line); }
.harness-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.harness .brand { font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.04em; display: flex; gap: 8px; align-items: center; }
.harness .brand b { font-family: var(--font-display); font-size: 1rem; letter-spacing: 0; color: var(--accent-strong); }
.harness .tag { border: 1px dashed var(--harness-line); border-radius: 4px; padding: 1px 6px; font-size: 0.7rem; text-transform: uppercase; }
.harness nav { display: flex; flex-wrap: wrap; gap: 4px; }
.harness nav button { background: transparent; border: 1px solid transparent; color: var(--harness-fg); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-weight: 500; }
.harness nav button:hover { border-color: var(--harness-line); }
.harness nav button[aria-current="page"] { background: var(--harness-fg); color: var(--harness-bg); }
.inbox { position: fixed; right: 16px; bottom: 16px; width: min(420px, calc(100vw - 32px)); max-height: 60vh; overflow: auto; z-index: 40; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.25); padding: 12px; }
.inbox .msg { border-top: 1px solid var(--line); padding: 8px 0; font-size: 0.86rem; white-space: pre-wrap; word-break: break-word; }
.inbox .msg:first-of-type { border-top: 0; }
.inbox .msg .label { display: block; margin-bottom: 2px; }
.hbtn .count { display: inline-block; min-width: 1.4em; padding: 0 4px; margin-left: 4px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 0.72rem; text-align: center; }
.harness .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
.harness label { font-family: var(--font-mono); font-size: 0.72rem; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.harness select, .harness .hbtn { background: transparent; color: var(--harness-fg); border: 1px solid var(--harness-line); border-radius: 6px; padding: 4px 8px; font-size: 0.82rem; max-width: 220px; }
.harness select option { background: var(--harness-bg); color: var(--harness-fg); }
.harness .hbtn { cursor: pointer; }
.harness .hpanel { display: contents; }
.harness .hmenu { display: none; }
@media (max-width: 720px) {
  .harness-inner { gap: 10px; }
  .harness .hmenu { display: inline-flex; margin-left: auto; }
  .harness .hpanel { display: none; width: 100%; }
  .harness .hpanel.open { display: flex; flex-direction: column; gap: 12px; padding-block: 6px 4px; }
  .harness .controls { margin-left: 0; flex-direction: column; align-items: stretch; }
  .harness label { justify-content: space-between; }
  .harness select { max-width: none; flex: 1; }
}

/* ---------------------------------------------------------------- page frames */
.page { padding-inline: 16px; padding-block: 24px 64px; }
.narrow { max-width: 600px; margin: 0 auto; }
.wide { max-width: 1180px; margin: 0 auto; }

/* ---------------------------------------------------------------- the business's storefront header (customer side) */
.cover { display: block; width: 100%; height: auto; aspect-ratio: 3 / 1; object-fit: cover; border-radius: 14px; margin-bottom: 16px; background: var(--surface-2); box-shadow: var(--shadow); }
.storefront { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; margin-bottom: 20px; }
.monogram { width: 52px; height: 52px; border-radius: 14px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; }
.storefront .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 0.85rem; }
.stars { color: var(--warn); letter-spacing: 1px; }

/* ---------------------------------------------------------------- building blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; border: 1px solid transparent; background: var(--accent); color: var(--accent-fg); text-decoration: none; min-height: 42px; }
.btn:hover { background: var(--accent-strong); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { background: transparent; color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.btn.danger:hover { background: var(--bad-soft); }
.btn.small { padding: 6px 10px; min-height: 34px; font-size: 0.88rem; }
.btn.link { background: none; border: 0; color: var(--accent); padding: 0; min-height: 0; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.btn.block { width: 100%; }
.spinner { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; cursor: pointer; }
.choice:hover { border-color: var(--accent); }
.choice[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.choice .name { font-weight: 600; }
.choice .price { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.choice .desc { grid-column: 1 / -1; color: var(--muted); font-size: 0.88rem; }
.choice .facts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 0.82rem; }
.choice.disabled { opacity: 0.5; cursor: not-allowed; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-weight: 600; font-size: 0.9rem; }
.field .opt { color: var(--muted); font-weight: 400; }
input[type="text"], input[type="tel"], input[type="email"], input[type="number"], input[type="time"], select, textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 42px;
}
textarea { min-height: 84px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--bad); }
.hint { color: var(--muted); font-size: 0.82rem; }
.err { color: var(--bad); font-size: 0.85rem; font-weight: 500; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.check { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { background: var(--surface); border: 0; padding: 8px 14px; cursor: pointer; font-weight: 500; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

.notice { border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; border: 1px solid transparent; }
.notice.info { background: var(--info-soft); color: var(--fg); border-color: color-mix(in srgb, var(--info) 30%, transparent); }
.notice.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.notice.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.notice.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.notice strong { font-weight: 700; }

.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.chip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.pending { background: var(--warn-soft); color: var(--warn); }
.chip.confirmed { background: var(--ok-soft); color: var(--ok); }
.chip.in-progress { background: var(--info-soft); color: var(--info); }
.chip.waiting-for-parts { background: var(--warn-soft); color: var(--warn); }
.chip.completed { background: var(--surface-2); color: var(--muted); }
.chip.cancelled, .chip.rejected, .chip.no-show { background: var(--bad-soft); color: var(--bad); }
.chip.flag { background: var(--warn-soft); color: var(--warn); }
.chip.flag::before { border-radius: 1px; transform: rotate(45deg); }

/* ---------------------------------------------------------------- booking flow */
.stepper { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; scrollbar-width: none; }
.stepper span { flex: none; font-size: 0.8rem; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-weight: 500; }
.stepper span.done { color: var(--accent); background: var(--accent-soft); }
.stepper span.now { background: var(--fg); color: var(--bg); }
.flowhead { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
.back { background: none; border: 1px solid var(--line); border-radius: 50%; width: 36px; height: 36px; flex: none; cursor: pointer; display: grid; place-items: center; }
.back:hover { background: var(--surface-2); }
.footer-bar { position: sticky; bottom: 0; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-top: 20px; }
.footer-bar .total { font-size: 0.9rem; }
.footer-bar .total b { font-size: 1.05rem; }

.daystrip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x proximity; }
.day { flex: none; width: 74px; scroll-snap-align: start; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 8px 6px; text-align: center; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.day .dw { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.day .dn { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; line-height: 1.1; }
.day .dc { font-size: 0.7rem; color: var(--muted); }
.day.full .dc, .day.closed .dc { color: var(--bad); }
.day.closed, .day.full { background: var(--surface-2); cursor: not-allowed; }
.day.closed .dn, .day.full .dn { color: var(--muted); }
.day[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }
.day[aria-pressed="true"] .dw, .day[aria-pressed="true"] .dc { color: var(--accent-fg); }
.slotgroup { display: flex; flex-direction: column; gap: 8px; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.slot { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.slot .t { font-family: var(--font-mono); font-weight: 500; font-size: 0.95rem; }
.slot .s { font-size: 0.72rem; color: var(--muted); text-align: center; }
.slot:hover { border-color: var(--accent); }
.slot[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.slot[aria-pressed="true"] .s { color: var(--accent-fg); }

.summary { display: grid; grid-template-columns: minmax(90px, auto) 1fr; gap: 8px 16px; margin: 0; }
.summary dt { color: var(--muted); font-size: 0.88rem; }
.summary dd { margin: 0; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.human { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--surface-2); max-width: 320px; }
.human button { width: 26px; height: 26px; border-radius: 4px; border: 2px solid var(--muted); background: var(--surface); cursor: pointer; display: grid; place-items: center; flex: none; }
.human.ok button { background: var(--ok); border-color: var(--ok); color: #fff; }
.human .who { font-size: 0.7rem; color: var(--muted); margin-left: auto; text-align: right; font-family: var(--font-mono); }
.ticket { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.ticket .top { background: var(--accent); color: var(--accent-fg); padding: 18px; display: flex; flex-direction: column; gap: 6px; }
.ticket .top.pending { background: var(--warn-soft); color: var(--fg); }
.ticket .ref { font-family: var(--font-mono); font-size: 0.85rem; letter-spacing: 0.1em; }
.ticket .body { padding: 18px; }

.empty { text-align: center; padding: 32px 16px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; align-items: center; }

/* ---------------------------------------------------------------- customer account */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tabs button[aria-current="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.bk { display: flex; flex-direction: column; gap: 10px; }
.bk .when { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; }
.bk .actions { display: flex; flex-wrap: wrap; gap: 8px; }
.codebox { font-family: var(--font-mono); font-size: 1.4rem; letter-spacing: 0.3em; text-align: center; }
.rate { display: flex; gap: 4px; }
.rate button { background: none; border: 0; font-size: 1.6rem; line-height: 1; cursor: pointer; color: var(--line); padding: 2px; }
.rate button.on { color: var(--warn); }

/* ---------------------------------------------------------------- business admin */
.adminhead { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between; margin-bottom: 16px; }
.datenav { display: flex; align-items: center; gap: 6px; }
.datenav .d { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; min-width: 150px; text-align: center; }
.attn { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.attn button { display: inline-flex; gap: 8px; align-items: center; border-radius: 8px; padding: 8px 12px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.attn button .n { font-family: var(--font-mono); background: var(--warn-soft); color: var(--warn); border-radius: 4px; padding: 0 6px; }
.attn button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.attn button[disabled] { opacity: 0.55; cursor: default; }
.attn button[disabled] .n { background: var(--surface-2); color: var(--muted); }
.adminbody { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.adminbody.open { grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); }
.blist { display: flex; flex-direction: column; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.brow { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; gap: 4px 14px; padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; cursor: pointer; width: 100%; }
.brow:last-child { border-bottom: 0; }
.brow:hover { background: var(--surface-2); }
.brow[aria-current="true"] { background: var(--accent-soft); }
.brow .time { font-family: var(--font-mono); font-size: 0.9rem; }
.brow .time small { display: block; color: var(--muted); font-size: 0.75rem; }
.brow .who { font-weight: 600; min-width: 0; }
.brow .what { color: var(--muted); font-size: 0.85rem; min-width: 0; }
.brow .tags { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.drawer { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
.drawer .card { display: flex; flex-direction: column; gap: 16px; }
.closex { background: none; border: 1px solid var(--line); border-radius: 6px; width: 32px; height: 32px; cursor: pointer; flex: none; }
.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; }
.hist li { display: grid; grid-template-columns: 96px 1fr; gap: 8px; }
.hist time { font-family: var(--font-mono); color: var(--muted); font-size: 0.78rem; }
.moves { display: flex; flex-wrap: wrap; gap: 8px; }
.private { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; font-size: 0.9rem; }

.board { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.board-inner { min-width: 760px; }
.board-row { display: grid; grid-template-columns: 130px 1fr; border-bottom: 1px solid var(--line); min-height: 52px; }
.board-row:last-child { border-bottom: 0; }
.board-row .rname { padding: 8px 12px; font-weight: 600; font-size: 0.88rem; border-right: 1px solid var(--line); display: flex; flex-direction: column; justify-content: center; }
.board-row .rname small { color: var(--muted); font-weight: 400; }
.track { position: relative; background-image: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px 100%); }
.board-hours { display: grid; grid-template-columns: 130px 1fr; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
.board-hours .ticks { position: relative; height: 26px; }
.board-hours .ticks span { position: absolute; top: 5px; transform: translateX(-50%); }
.blk { position: absolute; top: 6px; bottom: 6px; border-radius: 6px; padding: 3px 6px; font-size: 0.72rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; border: 1px solid transparent; text-align: left; line-height: 1.3; }
.blk.confirmed { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.blk.pending { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 55%, transparent); border-style: dashed; }
.blk.in-progress { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 45%, transparent); }
.blk.waiting-for-parts { background: var(--warn-soft); }
.blk.completed { background: var(--surface-2); color: var(--muted); }
.blk.cancelled, .blk.rejected, .blk.no-show { display: none; }
.blk.flagged { box-shadow: inset 3px 0 0 var(--warn); }
.blk.travel { background: repeating-linear-gradient(45deg, var(--surface-2) 0 4px, transparent 4px 8px); border-color: var(--line); color: var(--muted); }
.now-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bad); z-index: 2; }

.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.meter { display: flex; flex-direction: column; gap: 6px; }
.meter .bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.meter.near .bar i { background: var(--warn); }
.meter.full .bar i { background: var(--bad); }

<header class="harness" id="harness"></header>
<main id="app"></main>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="api-live.js"></script>
<script>
  /* load the businesses from the local backend first, then the screens (they read the business list as they load) */
  (async function () {
    const app = document.getElementById('app');
    app.innerHTML = '<div class="page"><div class="narrow"><p class="muted">Connecting to the local server…</p></div></div>';
    try { await JS.api.boot(); } catch (e) {
      app.innerHTML = '<div class="page"><div class="narrow"><div class="notice bad"><strong>The local server is not answering</strong><span>Start it with start.bat (or python run_local.py) and reload this page.</span></div></div></div>';
      return;
    }
    for (const f of ['core.js', 'booking.js', 'account.js', 'admin.js', 'signup.js']) {
      await new Promise((ok, bad) => { const s = document.createElement('script'); s.src = f; s.onload = ok; s.onerror = bad; document.body.appendChild(s); });
    }
    JS.start();
  })();
</script>
