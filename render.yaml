# Render blueprint for the public demo API (demo/server.py). Render > New > Blueprint > pick this repository.
# One web service (the API, its worker and the demo pages in one process) on the free plan: it sleeps after 15 minutes without visitors
# (the next visit takes 30-60 s). The database is on Neon's free plan, which does not expire (Render's free database is deleted after 30 days):
# see "The database (Neon)" in demo/README.md.
services:
  - type: web
    name: justsimple-demo-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python demo/server.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.0"
      # Neon's connection string, pasted on Render (Environment tab), never in this file: it holds the password
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PDPA_ENCRYPTION_KEY  # (generateValue makes a base64 value of 32 bytes, which is what the key must be)
        generateValue: true
      - key: PLATFORM_ADMIN_TOKEN
        generateValue: true
      # The demo website's sign-in emails a link (demo/access.py). Fill these in on Render (Environment tab); without them nobody can sign in.
      - key: DEMO_SMTP_HOST
        sync: false
      - key: DEMO_SMTP_PORT
        value: "2525"  # (Render's free plan blocks 25, 465 and 587; Brevo also listens on 2525)
      # The sample data goes back to fresh every night at this hour, Malaysia time (0-23), or "off" (demo/reset.py)
      - key: DEMO_RESET_HOUR
        value: "3"
      - key: DEMO_SMTP_USER
        sync: false
      - key: DEMO_SMTP_PASSWORD
        sync: false
      - key: DEMO_SMTP_FROM
        sync: false
